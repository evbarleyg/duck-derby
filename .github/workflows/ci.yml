name: CI

# Deployment moved to Vercel (auto-deploys from main via the GitHub
# integration), so this workflow only runs the checks. The old GitHub Pages
# deploy version lives in git history if we ever want it back.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: npm run ci
      - name: Network layer (relay + bot clients through the real session code)
        run: npm run ci:net
